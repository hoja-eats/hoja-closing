<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOJA Group 後台總覽</title>
<style>
:root{--s1:#9e3b2e;--s2:#2f5d7a;--s3:#2e6b4f;--ink:#222;--mut:#666;--line:#e5e0da;--bg:#faf8f5;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
header{background:#222;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
header a{color:#ccc;font-size:13px;text-decoration:none}
main{max-width:1020px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.muted{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
button.on{background:#222;color:#fff;border-color:#222}
button.primary{background:#222;color:#fff;border-color:#222}
input[type=password],input[type=text]{font-size:16px;padding:10px;border:1px solid #ccc;border-radius:8px;width:200px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .v{font-size:22px;font-weight:700}
.kpi .l{font-size:12px;color:var(--mut)}
.bar{height:10px;background:#eee;border-radius:5px;overflow:hidden;display:flex;margin-top:6px}
.bar div{height:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th:nth-child(2),td:nth-child(2){text-align:left}
.store-tag{display:inline-block;padding:2px 8px;border-radius:20px;color:#fff;font-size:12px}
.s1{background:var(--s1)}.s2{background:var(--s2)}.s3{background:var(--s3)}
.flag{color:#b00;font-weight:700}
.center{text-align:center;padding:28px 12px}
@media (max-width:640px){ table{font-size:12px} th,td{padding:6px 3px} }
</style>
</head>
<body>
<header><h1>HOJA Group 後台總覽</h1><a href="#" id="lock-link">🔒 鎖定</a></header>
<main>
<div id="gate" class="card center">
  <h2 style="margin-top:0">請輸入管理密碼</h2>
  <p class="muted">密碼只在這個頁面使用，不會儲存在任何地方。</p>
  <input type="password" id="pin-input" placeholder="管理密碼" inputmode="numeric">
  <div style="height:10px"></div>
  <button class="primary" id="pin-btn">進入總覽</button>
  <p id="pin-flag" class="flag"></p>
</div>
<div id="main-view" style="display:none">
  <div class="card">
    <div class="row" id="store-filter">
      <button data-store="" class="on">全部</button>
      <button data-store="一店">一店</button>
      <button data-store="二店">二店</button>
      <button data-store="三店">三店</button>
    </div>
    <div style="height:10px"></div>
    <div class="row" id="range-filter">
      <button data-range="today">今日</button>
      <button data-range="7" class="on">本週</button>
      <button data-range="prev7">上週</button>
      <button data-range="7d">近 7 天</button>
      <button data-range="30d">近 30 天</button>
      <button data-range="0">全部</button>
    </div>
    <p class="muted" id="load-note"></p>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="card">
    <h3 style="margin-top:0">三店比較 <span class="muted" id="cmp-period"></span></h3>
    <div id="compare"></div>
  </div>
  <div class="card">
    <h3 style="margin-top:0">每日明細</h3>
    <div style="overflow-x:auto"><table id="daily-table">
      <thead><tr><th>店別</th><th>日期</th><th>開早現金</th><th>淨營業額</th><th>現金</th><th>刷卡</th><th>外帶</th><th>Cash Tips</th><th>Card Tips</th><th>Tips%</th><th>留底</th><th>袋中現金</th><th>結帳人</th></tr></thead>
      <tbody id="daily-body"></tbody>
    </table></div>
    <p class="muted" id="daily-empty" style="display:none">這個區間沒有資料。</p>
  </div>
  <div class="card">
    <h3 style="margin-top:0">週彙總 — 現金總結算 <span class="muted">（每週 Envelope 合計，整包存入）</span></h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>店別</th><th>週</th><th>天數</th><th>現金總結算</th><th>Card Tips</th></tr></thead>
      <tbody id="weekly-body"></tbody>
    </table></div>
    <div style="height:10px"></div>
    <button id="csv-btn">匯出週現金結算 CSV</button>
  </div>
  <div class="card center" id="error-box" style="display:none">
    <p id="error-text" class="flag"></p>
    <button id="retry-btn">重新輸入密碼再試</button>
  </div>
</div>
</main>
<script>
"use strict";
var ENDPOINT = "https://script.google.com/macros/s/AKfycbxO6lz_u4VRalfLfmGfIVCT5vTpPTKRIP2QYVaAsqe28KD_0vlWm0C0jO7fS-jrrGOCxQ/exec";
var pin = "";
var allRecords = [], allOpenings = [];
var storeFilter = "", rangeMode = "7";
var STORE_COLOR = { "一店":"var(--s1)", "二店":"var(--s2)", "三店":"var(--s3)" };
var STORE_CLASS = { "一店":"s1", "二店":"s2", "三店":"s3" };

function $(id){ return document.getElementById(id); }
function money(n){ return "$" + (parseFloat(n)||0).toFixed(2); }
function round2(n){ return Math.round((parseFloat(n)||0)*100)/100; }
function sum(rows, k){ return round2(rows.reduce(function(a,r){ return a + (parseFloat(r[k])||0); }, 0)); }
function isoOf(d){ var m=("0"+(d.getMonth()+1)).slice(-2); var dd=("0"+d.getDate()).slice(-2); return d.getFullYear()+"-"+m+"-"+dd; }
function weekStartOf(dateStr){
  var d = new Date(dateStr + "T12:00:00");
  d.setDate(d.getDate() - d.getDay());
  return isoOf(d);
}
/* 「今日」以多倫多（店的營業日）日期為準，避免台灣時差看到錯天 */
function torontoToday(){
  try {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Toronto", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  } catch(e){
    return isoOf(new Date());
  }
}
function jsonpGet(url){
  return new Promise(function(resolve, reject){
    var name = "hoja_cb_" + Date.now() + "_" + Math.floor(Math.random()*1000000);
    var s = document.createElement("script");
    var timer = setTimeout(function(){ cleanup(); reject(new Error("timeout")); }, 25000);
    function cleanup(){
      clearTimeout(timer);
      try { delete window[name]; } catch(e){ window[name] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    window[name] = function(data){ cleanup(); resolve(data); };
    s.onerror = function(){ cleanup(); reject(new Error("load failed")); };
    s.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + name;
    (document.head || document.documentElement).appendChild(s);
  });
}
function loadData(){
  $("load-note").textContent = "讀取中…";
  jsonpGet(ENDPOINT + "?pin=" + encodeURIComponent(pin)).then(function(j){
    if (j && j.auth && j.records){
      allRecords = j.records;
      allOpenings = j.openings ? j.openings : [];
      $("load-note").textContent = "資料來源：Google 試算表，共 " + allRecords.length + " 筆結帳紀錄。";
      render();
    } else {
      pin = "";
      $("main-view").style.display = "none";
      $("gate").style.display = "block";
      $("pin-flag").textContent = "密碼不正確，請再試一次。";
      $("pin-input").value = "";
    }
  }).catch(function(){
    $("error-box").style.display = "block";
    $("error-text").textContent = "連不到中央資料庫（Load failed）。請確認網路連線後，重新輸入密碼再試。";
    $("load-note").textContent = "";
  });
}
function inRange(rec){
  var today = new Date();
  if (rangeMode === "today"){
    return rec.date === torontoToday();
  }
  if (rangeMode === "7"){
    var start = new Date(today); start.setDate(today.getDate() - today.getDay());
    return rec.date >= isoOf(start);
  }
  if (rangeMode === "prev7"){
    var s = new Date(today); s.setDate(today.getDate() - today.getDay() - 7);
    var e = new Date(today); e.setDate(today.getDate() - today.getDay() - 1);
    return rec.date >= isoOf(s) && rec.date <= isoOf(e);
  }
  if (rangeMode === "7d"){
    var c7 = new Date(today); c7.setDate(today.getDate() - 6);
    return rec.date >= isoOf(c7);
  }
  if (rangeMode === "30d"){
    var c30 = new Date(today); c30.setDate(today.getDate() - 29);
    return rec.date >= isoOf(c30);
  }
  return true;
}
function filteredRows(){
  return allRecords.filter(function(r){
    return (!storeFilter || r.store === storeFilter) && inRange(r);
  }).slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });
}
function findOpening(store, date){
  for (var i = 0; i < allOpenings.length; i++){
    var o = allOpenings[i];
    if (o.store === store && o.date === date) return o;
  }
  return null;
}
function render(){
  var rows = filteredRows();
  var net = sum(rows,"netSales"), dine = sum(rows,"dineIn"), take = sum(rows,"takeout"),
      tips = sum(rows,"totalTips"), ctips = sum(rows,"cardTips"), env = sum(rows,"envelope");
  var avgTips = net > 0 ? (tips / net * 100) : 0;
  var days = {};
  rows.forEach(function(r){ days[r.store + "|" + r.date] = true; });
  var kpiDefs = [
    ["淨營業額 Net Sales", money(net)],
    ["內用 Dine In", money(dine)],
    ["外帶 Takeout", money(take)],
    ["小費合計 Total Tips", money(tips)],
    ["平均 Tips%", avgTips.toFixed(2) + "%"],
    ["Card Tips 合計", money(ctips)],
    ["袋中現金合計 Envelope", money(env)],
    ["有資料天數", Object.keys(days).length + " 天"]
  ];
  $("kpis").innerHTML = kpiDefs.map(function(k){
    return '<div class="kpi"><div class="v">' + k[1] + '</div><div class="l">' + k[0] + '</div></div>';
  }).join("");
  var stores = ["一店","二店","三店"];
  var cmp = stores.map(function(st){
    var sr = rows.filter(function(r){ return r.store === st; });
    return { store: st, net: sum(sr,"netSales"), tips: sum(sr,"totalTips"), days: sr.length };
  });
  var totalNet = cmp.reduce(function(a,c){ return a + c.net; }, 0) || 1;
  $("cmp-period").textContent = "(" + rows.length + " 筆)";
  $("compare").innerHTML = cmp.map(function(c){
    var pct = Math.round(c.net / totalNet * 100);
    return '<div style="margin-bottom:10px"><span class="store-tag ' + STORE_CLASS[c.store] + '">' + c.store + '</span> ' +
      money(c.net) + ' · ' + pct + '% · ' + c.days + ' 天 · Tips ' + money(c.tips) +
      '<div class="bar"><div style="width:' + pct + '%;background:' + STORE_COLOR[c.store] + '"></div></div></div>';
  }).join("");
  var body = rows.map(function(r){
    var o = findOpening(r.store, r.date);
    var floatCell = (r.floatTotal === null || r.floatTotal === undefined || r.floatTotal === 0) ? "—" : money(r.floatTotal);
    var floatBad = (r.floatTotal !== null && r.floatTotal !== undefined && r.floatTotal !== 0 && round2(r.floatTotal) !== 250);
    return '<tr><td><span class="store-tag ' + (STORE_CLASS[r.store]||"") + '">' + (r.store||"") + '</span></td>' +
      '<td>' + r.date + '</td><td>' + (o ? money(o.total) : "—") + '</td>' +
      '<td>' + money(r.netSales) + '</td><td>' + money(r.cashSales) + '</td><td>' + money(r.cardSales) + '</td>' +
      '<td>' + money(r.takeout) + '</td><td>' + money(r.cashTips) + '</td><td>' + money(r.cardTips) + '</td>' +
      '<td>' + ((parseFloat(r.tipsPct)||0)*100).toFixed(2) + '%</td>' +
      '<td' + (floatBad ? ' class="flag"' : '') + '>' + floatCell + '</td>' +
      '<td>' + money(r.envelope) + '</td><td>' + (r.server || "") + '</td></tr>';
  }).join("");
  $("daily-body").innerHTML = body;
  $("daily-empty").style.display = rows.length ? "none" : "block";
  var weeks = {};
  rows.forEach(function(r){
    var key = r.store + "|" + weekStartOf(r.date);
    weeks[key] = weeks[key] || { store: r.store, week: weekStartOf(r.date), days: 0, env: 0, ctips: 0 };
    weeks[key].days += 1;
    weeks[key].env = round2(weeks[key].env + (parseFloat(r.envelope)||0));
    weeks[key].ctips = round2(weeks[key].ctips + (parseFloat(r.cardTips)||0));
  });
  var wlist = Object.keys(weeks).map(function(k){ return weeks[k]; })
    .sort(function(a,b){ return a.week < b.week ? -1 : (a.week > b.week ? 1 : (a.store < b.store ? -1 : 1)); });
  $("weekly-body").innerHTML = wlist.map(function(w){
    return '<tr><td><span class="store-tag ' + (STORE_CLASS[w.store]||"") + '">' + w.store + '</span></td>' +
      '<td>' + w.week + ' 起</td><td>' + w.days + '</td><td><strong>' + money(w.env) + '</strong></td><td>' + money(w.ctips) + '</td></tr>';
  }).join("");
}
function exportCSV(){
  var rows = filteredRows();
  var weeks = {};
  rows.forEach(function(r){
    var key = r.store + "|" + weekStartOf(r.date);
    weeks[key] = weeks[key] || { store: r.store, week: weekStartOf(r.date), days: 0, env: 0 };
    weeks[key].days += 1;
    weeks[key].env = round2(weeks[key].env + (parseFloat(r.envelope)||0));
  });
  var lines = ["Store,Week Start,Week End,Days,Cash Settlement"];
  Object.keys(weeks).sort().forEach(function(k){
    var w = weeks[k];
    var end = new Date(w.week + "T12:00:00"); end.setDate(end.getDate() + 6);
    lines.push([w.store, w.week, isoOf(end), w.days, w.env.toFixed(2)].join(","));
  });
  var blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hoja_cash_settlement.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}
function lock(){
  pin = ""; allRecords = []; allOpenings = [];
  $("main-view").style.display = "none";
  $("error-box").style.display = "none";
  $("gate").style.display = "block";
  $("pin-input").value = "";
  $("pin-flag").textContent = "";
}
$("pin-btn").addEventListener("click", function(){
  pin = $("pin-input").value;
  if (!pin){ $("pin-flag").textContent = "請輸入密碼。"; return; }
  $("pin-flag").textContent = "";
  $("gate").style.display = "none";
  $("main-view").style.display = "block";
  $("error-box").style.display = "none";
  loadData();
});
$("pin-input").addEventListener("keydown", function(e){ if (e.key === "Enter") $("pin-btn").click(); });
$("retry-btn").addEventListener("click", function(){ lock(); });
$("lock-link").addEventListener("click", function(e){ e.preventDefault(); lock(); });
$("csv-btn").addEventListener("click", exportCSV);
document.querySelectorAll("#store-filter button").forEach(function(b){
  b.addEventListener("click", function(){
    storeFilter = b.getAttribute("data-store");
    document.querySelectorAll("#store-filter button").forEach(function(x){ x.classList.toggle("on", x === b); });
    render();
  });
});
document.querySelectorAll("#range-filter button").forEach(function(b){
  b.addEventListener("click", function(){
    rangeMode = b.getAttribute("data-range");
    document.querySelectorAll("#range-filter button").forEach(function(x){ x.classList.toggle("on", x === b); });
    render();
  });
});
</script>
</body>
</html>
